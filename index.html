    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>

    <script>
        const ChartJS = window.Chart;
        // Check local storage for theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>

    <style type="text/tailwindcss">
    @layer base {
        body {
            @apply bg-slate-50 dark:bg-[#0b1120] text-slate-700 dark:text-slate-300 transition-colors duration-300 antialiased;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply text-slate-900 dark:text-white transition-colors duration-300;
        }
        /* Comprehensive dark mode overrides for all un-prefixed color utilities */
        .dark .bg-white { @apply !bg-[#111827]; }
        .dark .bg-slate-50 { @apply !bg-[#0b1120]; }
        .dark .bg-slate-100 { @apply !bg-slate-800/60; }
        .dark .bg-slate-200 { @apply !bg-slate-800; }
        
        .dark .text-slate-900,
        .dark .text-slate-800,
        .dark .text-slate-700 { @apply !text-slate-200; }
        
        .dark .text-slate-600,
        .dark .text-slate-500 { @apply !text-slate-400; }
        
        .dark .border-slate-100,
        .dark .border-slate-200,
        .dark .border-slate-300 { @apply !border-slate-800; }
        
        .dark th { @apply !text-slate-300 !border-slate-800; }
        .dark td { @apply !text-slate-400 !border-slate-800; }
        .dark input, .dark select, .dark textarea { @apply !bg-slate-900 !border-slate-700 !text-white !placeholder-slate-500 focus:!border-blue-500 focus:!ring-blue-500/50; }
        
        /* Ensure table hover states look good in dark mode */
        .dark tr:hover td { @apply !bg-slate-800/80; }
    }

    @layer components {
        .card {
            @apply bg-white dark:bg-slate-800/50 p-6 rounded-2xl shadow-sm hover:shadow-md border border-slate-200/60 dark:border-slate-700/50 backdrop-blur-sm transition-all duration-300;
        }
        .btn-primary {
            @apply bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-5 py-2.5 rounded-xl font-medium hover:from-blue-700 hover:to-indigo-700 hover:shadow-lg hover:shadow-blue-500/25 active:scale-95 transition-all duration-200;
        }
        .nav-item {
            @apply flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-all cursor-pointer;
        }
        .nav-item.active {
            @apply bg-gradient-to-r from-blue-600/20 to-indigo-600/20 text-blue-400 font-semibold border border-blue-500/20;
        }
        .input-base {
            @apply w-full px-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 dark:focus:ring-blue-500/50 transition-all text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500;
        }
        .table-header {
            @apply bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider;
        }
        .table-row {
            @apply hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors border-b border-slate-100 dark:border-slate-800/50 last:border-0;
        }
    }
    </style>
</head>
